name: Test Android Devices [chrome, cpu1]

on:
  # Run daily at 11 PM UTC
  # schedule:
  #   - cron: '0 23 * * *'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        type: choice
        options:
          - prod
          - dev
        default: "prod"
        required: true
      use-beta:
        description: "Use beta version"
        type: boolean
        default: false
        required: false

jobs:
  test-android-devices:
    name: ${{ matrix.device }} - API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel all jobs if one fails
      fail-fast: false
      matrix:
        include:
          # Pixel 6 supports API 32-37
          - device: pixel-6
            api-level: "32"
          - device: pixel-6
            api-level: "33"
          - device: pixel-6
            api-level: "34"
          - device: pixel-6
            api-level: "35"
          - device: pixel-6
            api-level: "36"
          - device: pixel-6
            api-level: "37"

          # Pixel 7 supports API 33-37
          - device: pixel-7
            api-level: "33"
          - device: pixel-7
            api-level: "34"
          - device: pixel-7
            api-level: "35"
          - device: pixel-7
            api-level: "36"
          - device: pixel-7
            api-level: "37"

          # Google Play: pixel-7 / API 34 (the Play cell Pixel 7 keeps until its removal)
          - device: pixel-7
            api-level: "34"
            google-play: true

          # Generic Tablet supports API 36 and 37 (37 is in android-new-devices-matrix.yml)
          - device: generic-tablet
            api-level: "36"

    steps:
      - uses: actions/checkout@v3

      - name: Run Android Device Tests
        uses: devicecloud-dev/device-cloud-for-maestro@v2
        with:
          api-key: ${{ github.event.inputs.environment == 'dev' && secrets.DCD_DEV_API_KEY || secrets.DCD_API_KEY }}
          api-url: ${{ github.event.inputs.environment == 'dev' && 'https://api.dev.devicecloud.dev' || '' }}
          app-file: ./binaries/sample.apk
          workspace: ./flows/chrome-flow.yaml
          android-device: ${{ matrix.device }}
          android-api-level: ${{ matrix.api-level }}
          google-play: ${{ matrix.google-play || '' }}
          runner-type: cpu1
          use-beta: ${{ github.event.inputs.use-beta }}
          name: "${{ matrix.device }} - Android API ${{ matrix.api-level }}${{ matrix.google-play && ' with Play' || '' }} Test Run"
