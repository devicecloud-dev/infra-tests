name: Test iOS Devices

on:
  # Run at 1 AM UTC every 2 days
  schedule:
    - cron: "0 1 */2 * *"
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        type: choice
        options:
          - prod
          - dev
        default: "prod"
        required: true
      use-beta:
        description: "Use beta version"
        type: boolean
        default: false
        required: false

jobs:
  test-ios-devices:
    name: ${{ matrix.device }} - iOS ${{ matrix.ios-version }}
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel all jobs if one fails
      fail-fast: false
      matrix:
        include:
          # iPhone 14 series (iOS 17-18)
          - device: iphone-14
            ios-version: "17"
          - device: iphone-14
            ios-version: "18"

          # iPhone 15 series (iOS 17-18)
          - device: iphone-15
            ios-version: "17"

          # iPhone 16 series (iOS 18, 26)
          - device: iphone-16
            ios-version: "18"
          - device: iphone-16
            ios-version: "26"

          - device: iphone-16-plus
            ios-version: "26"

          - device: iphone-16-pro
            ios-version: "18"
          - device: iphone-16-pro
            ios-version: "26"

          - device: iphone-16-pro-max
            ios-version: "18"
          - device: iphone-16-pro-max
            ios-version: "26"
          
          # iPad Pro (iOS 18, 26)
          - device: ipad-pro-6th-gen
            ios-version: "18"
          - device: ipad-pro-6th-gen
            ios-version: "26"

    steps:
      - uses: actions/checkout@v3

      # binaries/dcdsmoke.zip replaced the Wikipedia build on 2026-09-23. That
      # build is x86_64-only, and iOS 26.5 and 27.0 refuse to install it
      # ("Failed to find matching arch"), so every cell on a current runtime
      # failed. dcdsmoke is a 9KB native SwiftUI app built for arm64 with a
      # 17.0 deployment target, so it installs on every version we support —
      # and SwiftUI's scene-based lifecycle means it cannot hit the iOS 27
      # UIScene termination that the Expo fixture does.
      #
      # It is also app-file rather than app-binary-id, matching
      # ios-maestro-version-matrix.yml: a pinned id is eventually purged by
      # retention, and one fixture per environment is one more thing to keep
      # in step. Source lives in fixtures/ios-smoke/.
      #
      # One flow for every device now. The old split existed because the
      # Wikipedia walkthrough asserted a layout that differed on Pro and iPad
      # screens; the smoke app renders identically everywhere.
      - name: Run iOS Device Tests
        uses: devicecloud-dev/device-cloud-for-maestro@v2
        with:
          api-key: ${{ github.event.inputs.environment == 'dev' && secrets.DCD_DEV_API_KEY || secrets.DCD_API_KEY }}
          api-url: ${{ github.event.inputs.environment == 'dev' && 'https://api.dev.devicecloud.dev' || '' }}
          app-file: ./binaries/dcdsmoke.zip
          workspace: ./flows/ios-smoke.yaml
          ios-device: ${{ matrix.device }}
          ios-version: ${{ matrix.ios-version }}
          use-beta: ${{ github.event.inputs.use-beta }}
          name: "${{ matrix.device }} - iOS ${{ matrix.ios-version }} Test Run"
          retry: 1
