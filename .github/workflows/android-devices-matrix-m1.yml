name: Test Android Devices [m1]

on:
  # Run daily at 9 PM UTC
  schedule:
    - cron: '0 21 * * *'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        type: choice
        options:
          - prod
          - dev
        default: "prod"
        required: true
      use-beta:
        description: "Use beta version"
        type: boolean
        default: false
        required: false

jobs:
  test-android-devices:
    name: ${{ matrix.device }} - API ${{ matrix.api-level }}${{ matrix.google-play && ' Play' || '' }}
    runs-on: ubuntu-latest

    strategy:
      # Do not cancel all jobs if one fails
      fail-fast: false
      # Mirrors the Mac AVD matrix (infra ansible/ios/android-update.ansible.yml,
      # REQUIRED_ANDROID_AVDS in dcd): API 34+ only on the Macs, no tablet.
      matrix:
        include:
          - device: pixel-6
            api-level: "34"
          - device: pixel-6
            api-level: "35"
          - device: pixel-6
            api-level: "36"
          - device: pixel-6
            api-level: "37"
          - device: pixel-7
            api-level: "34"
          - device: pixel-7
            api-level: "35"
          - device: pixel-7
            api-level: "36"
          - device: pixel-7
            api-level: "37"

          # Google Play on m1 (dcd#1620): the Mac Play AVDs, M1_PLAY_SIMULATORS
          # in dcd. Play moves here from cpu1 on 14 December 2026.
          - device: pixel-8
            api-level: "34"
            google-play: true
          - device: pixel-10
            api-level: "36"
            google-play: true
          - device: pixel-10
            api-level: "37"
            google-play: true

    steps:
      - uses: actions/checkout@v3

      - name: Run Android Device Test
        uses: devicecloud-dev/device-cloud-for-maestro@v2
        with:
          api-key: ${{ github.event.inputs.environment == 'dev' && secrets.DCD_DEV_API_KEY || secrets.DCD_API_KEY }}
          api-url: ${{ github.event.inputs.environment == 'dev' && 'https://api.dev.devicecloud.dev' || '' }}
          app-file: ./binaries/sample.apk
          workspace: ./flows/android-flow.yaml
          android-device: ${{ matrix.device }}
          android-api-level: ${{ matrix.api-level }}
          google-play: ${{ matrix.google-play || '' }}
          runner-type: m1
          use-beta: ${{ github.event.inputs.use-beta }}
          retry: 1
          name: "${{ matrix.device }} - Android API ${{ matrix.api-level }}${{ matrix.google-play && ' with Play' || '' }} Test Run [m1]"
